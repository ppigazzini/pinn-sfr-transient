name: paper

# Build the submission PDF and publish it as a downloadable artefact.
#
# This lane exists because the LaTeX copy cannot be built where it is written: the
# development machine has no TeX engine, so `paper/paper.tex` was committed verified
# only structurally -- balanced environments, balanced braces, no dangling \ref. That
# catches what would stop a build; it does not catch what would make one fail. CI is
# therefore the FIRST place the paper is actually compiled, and a red run here means
# the paper does not build, not that a formatting nicety slipped.
#
# It also draws the transient charts, so the figures a reader sees are regenerated from
# the physics on every push rather than exported by hand from a notebook.
on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "paper/**"
      - "src/pinn_sfr_transient/axial/charts.py"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: [main]
    paths:
      - "paper/**"
      - "src/pinn_sfr_transient/axial/charts.py"
      - ".github/workflows/paper.yml"
  # Buildable on demand, because a paper is something you want a PDF of when you want
  # it and not only when a file under `paper/` happens to change.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    # ONE job, and the order inside it is the point: the paper embeds the charts, so
    # they have to be drawn before pdflatex runs or the build fails on a missing file.
    # Two jobs would express the same dependency through `needs:` plus an artefact
    # round-trip, which is more moving parts for an ordering that is already sequential.
    name: draw charts, then build the paper PDF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Core dependencies only. The charts come from the reference solver, which needs
      # numpy, scipy and matplotlib and none of the three deep-learning extras -- so
      # this also proves they have not grown a quiet dependency on one.
      - name: Sync core dependencies
        run: uv sync --locked --python 3.13

      # Into `docs/img/charts`, which is gitignored and is the path all three paper
      # copies reference. One canonical location means a local build and a CI build
      # resolve the same figures -- Typst has no `graphicspath` equivalent, so a
      # second location would fork the Typst copy from the other two.
      - name: Draw the charts the paper embeds
        run: uv run python -m pinn_sfr_transient.axial.charts --outdir docs/img/charts

      - name: Upload charts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transient-charts
          path: docs/img/charts
          if-no-files-found: error

      # The packages the preamble names, not `scheme-full`: that is several GB for a
      # document using eight packages, and listing them means a future `\usepackage`
      # fails loudly rather than silently pulling a dependency nobody recorded.
      #
      # `texlive-plain-generic` is here because of a build failure, not a guess.
      # `newtxtext.sty` inputs `binhex.tex`, which lives in that package, and
      # `--no-install-recommends` drops it -- so the first run of this lane installed
      # newtx, found it, used it, and died on its missing dependency.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            latexmk

      # Report which Times the build will use, and check the dependency rather than
      # only the package. `newtxtext.sty` being present is NOT sufficient -- that is
      # exactly what the first failure looked like.
      - name: Report the font path taken
        run: |
          if kpsewhich newtxtext.sty >/dev/null && kpsewhich binhex.tex >/dev/null; then
            echo "newtx available (Times via TeX Gyre Termes)"
          else
            echo "newtx incomplete -- the preamble's mathptmx fallback will be used"
            kpsewhich newtxtext.sty || echo "  newtxtext.sty missing"
            kpsewhich binhex.tex   || echo "  binhex.tex missing"
          fi

      # Fail here rather than inside pdflatex. A missing figure surfaces as
      # "File `...' not found" partway through a 200-line log; this says which one.
      - name: Check the embedded figures exist
        run: |
          missing=0
          for f in temperature_map vapor_fraction front_height reactivity \
                   void_worth_split boundary_conditions; do
            if [ ! -s "docs/img/charts/$f.png" ]; then
              echo "::error::docs/img/charts/$f.png missing -- the paper embeds it"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "all embedded figures present"
          exit "$missing"

      - name: Build paper.pdf
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build paper/paper.tex

      # A LaTeX run can exit 0 with an unresolved cross-reference, which prints as a
      # literal `??` in the PDF. Fail on that: a submission with `??` in it is worse
      # than a failed build, because nothing draws attention to it.
      - name: Reject unresolved references
        run: |
          if grep -q "There were undefined references" build/paper.log; then
            echo "::error::undefined references -- the PDF would contain '??'"
            grep -n "undefined" build/paper.log || true
            exit 1
          fi
          echo "all references resolved"

      - name: Upload paper.pdf
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-pdf
          path: build/paper.pdf
          if-no-files-found: error

      # Kept on failure too: the log is the only way to diagnose a build that cannot
      # be reproduced on the machine the paper is written on.
      - name: Upload LaTeX log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-latex-log
          path: build/paper.log
          if-no-files-found: warn
